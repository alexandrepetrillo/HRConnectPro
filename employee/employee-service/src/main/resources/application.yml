spring:
  application:
    name: employee-service

  datasource:
    url: jdbc:postgresql://localhost:5432/hrconnect?currentSchema=employee
    username: hrconnect
    password: hrconnect
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: employee

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: employee
    default-schema: employee

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        spring.json.add.type.headers: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,circuitbreakerevents,retries,retryevents
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.hrconnect.employee: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# JWT Configuration
jwt:
  secret: hrconnect-secret-key-for-jwt-token-generation-minimum-256-bits-required-for-hs256
  validity: 3600000  # 1 heure en millisecondes

# LDAP Configuration (désactivé par défaut, utilise in-memory)
ldap:
  enabled: true
  url: ldap://localhost:389
  base-dn: dc=hrconnect,dc=local
  user-dn-pattern: uid={0},ou=users
  manager-dn: cn=admin,dc=hrconnect,dc=local
  manager-password: admin

# Service externe de vérification du numéro de sécurité sociale
external:
  secu-validator:
    url: http://localhost:8089

# Configuration Resilience4j
resilience4j:
  circuitbreaker:
    instances:
      secuValidator:
        registerHealthIndicator: true
        slidingWindowSize: 10                    # Fenêtre de 10 appels
        minimumNumberOfCalls: 5                  # Minimum 5 appels avant d'évaluer
        failureRateThreshold: 50                 # 50% d'échecs → OPEN
        slowCallRateThreshold: 100               # 100% d'appels lents comptent
        slowCallDurationThreshold: 2s            # > 2s = "lent"
        waitDurationInOpenState: 30s             # Reste OPEN pendant 30s
        permittedNumberOfCallsInHalfOpenState: 3 # 3 appels tests en HALF_OPEN
        automaticTransitionFromOpenToHalfOpenEnabled: true

  retry:
    instances:
      secuValidator:
        maxAttempts: 3                           # 3 tentatives max
        waitDuration: 500ms                      # Délai entre tentatives
        exponentialBackoffMultiplier: 2          # 500ms → 1s → 2s
        retryExceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.ResourceAccessException
        ignoreExceptions:
          - com.hrconnect.employee.infrastructure.external.SecuValidationException

  timelimiter:
    instances:
      secuValidator:
        timeoutDuration: 3s                      # Timeout après 3 secondes
        cancelRunningFuture: true


spring:
  application:
    name: interview-service

  datasource:
    url: jdbc:postgresql://localhost:5433/hrconnect?currentSchema=interview
    username: hrconnect
    password: hrconnect
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: interview

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: interview
    default-schema: interview

  kafka:
    bootstrap-servers: localhost:9093
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # Activer les type headers avec le FQCN pour la désérialisation côté consumer
        spring.json.add.type.headers: true
    consumer:
      group-id: interview-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.hrconnect.employee.contract,com.hrconnect.interview.contract
        # Utiliser les type headers envoyés par le producteur (approche standard avec contrat partagé)
        spring.json.use.type.headers: true

server:
  port: 9083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.hrconnect.interview: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: INFO

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

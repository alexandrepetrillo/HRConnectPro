# Configuration Docker Compose pour le développement local
#
# Ce fichier contient la configuration complète avec :
# - Les container_name pour faciliter l'identification
# - Les ports fixes (5433:5432 pour PostgreSQL, etc.)
# - Les networks et volumes persistants
#
# Usage : docker compose up -d
# Pour monitoring : docker compose --profile monitoring up -d

services:
  # PostgreSQL pour Employee Service
  postgres:
    image: postgres:16-alpine
    container_name: hrconnect-postgres
    environment:
      POSTGRES_DB: hrconnect
      POSTGRES_USER: hrconnect
      POSTGRES_PASSWORD: hrconnect
    ports:
      - "5433:5432"
    volumes:
      - hrconnect-postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrconnect -d hrconnect"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hrconnect-network

  # Kafka & Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: hrconnect-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - hrconnect-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: hrconnect-kafka
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"
      - "29093:29093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29093,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9093"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - hrconnect-network

  # OpenLDAP (pour l'authentification)
  ldap:
    image: osixia/openldap:1.5.0
    container_name: hrconnect-ldap
    environment:
      LDAP_ORGANISATION: "HRConnect"
      LDAP_DOMAIN: "hrconnect.local"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_CONFIG_PASSWORD: "config"
      LDAP_RFC2307BIS_SCHEMA: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "true"
      LDAP_TLS_VERIFY_CLIENT: "never"
      LDAP_SEED_INTERNAL_LDIF_PATH: "/home/ldif"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - hrconnect-ldap-data:/var/lib/ldap
      - hrconnect-ldap-config:/etc/ldap/slapd.d
      - ./scripts/ldap-bootstrap:/home/ldif
    networks:
      - hrconnect-network
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost:389", "-b", "dc=hrconnect,dc=local", "-D", "cn=admin,dc=hrconnect,dc=local", "-w", "admin"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Kafka UI (optionnel, pour visualiser les topics)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: hrconnect-kafka-ui
    profiles: ["monitoring"]
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: hrconnect
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29093
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - hrconnect-network

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: hrconnect-prometheus
    profiles: ["monitoring"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - hrconnect-prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - hrconnect-network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: hrconnect-grafana
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - hrconnect-grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - hrconnect-network

  # Jaeger - Tracing distribué
  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: hrconnect-jaeger
    profiles: ["monitoring"]
    ports:
      - "16686:16686"   # UI Jaeger
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - hrconnect-network

  # phpLDAPadmin (interface web pour gérer LDAP)
  ldap-admin:
    image: osixia/phpldapadmin:0.9.0
    container_name: hrconnect-ldap-admin
    profiles: ["monitoring"]
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: ldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8003:80"
    depends_on:
      - ldap
    networks:
      - hrconnect-network

  # WireMock - Service de vérification du numéro de sécurité sociale (mock)
  secu-validator:
    image: wiremock/wiremock:3.3.1
    container_name: hrconnect-secu-validator
    ports:
      - "8089:8080"
    volumes:
      - ./mock-services/secu-validator/mappings:/home/wiremock/mappings
      - ./mock-services/secu-validator/__files:/home/wiremock/__files
    command: ["--global-response-templating", "--verbose"]
    networks:
      - hrconnect-network

volumes:
  hrconnect-postgres-data:
  hrconnect-prometheus-data:
  hrconnect-grafana-data:
  hrconnect-ldap-data:
  hrconnect-ldap-config:

networks:
  hrconnect-network:
    driver: bridge


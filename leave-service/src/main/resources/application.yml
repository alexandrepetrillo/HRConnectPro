spring:
  application:
    name: leave-service

  datasource:
    url: jdbc:postgresql://localhost:5433/hrconnect?currentSchema=leave
    username: hrconnect
    password: hrconnect
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: leave

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: leave
    default-schema: leave

  kafka:
    bootstrap-servers: localhost:9093
    consumer:
      group-id: leave-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.hrconnect.employee.contract.EmployeeState
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        spring.json.add.type.headers: false
        spring.json.type.mapping: Employee:com.hrconnect.leave.infrastructure.event.EmployeeState

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.hrconnect.leave: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# JWT Configuration
jwt:
  secret: hrconnect-secret-key-for-jwt-token-generation-minimum-256-bits-required-for-hs256
  validity: 3600000  # 1 heure en millisecondes

# Kafka Topics
kafka:
  topics:
    employee-state: employee.state
    leave-state: leave.state


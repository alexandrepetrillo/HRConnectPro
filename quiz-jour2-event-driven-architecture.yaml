  - text: "Si on modifie un champ dans un événement partagé et que ça casse la compatibilité, quelle version incrémente-t-on ?"
    type: QCM
    timeLimit: 30
    points: 1000
    answers:
      - "PATCH (0.0.1 → 0.0.2)"
      - "MINOR (0.1.0 → 0.2.0)"

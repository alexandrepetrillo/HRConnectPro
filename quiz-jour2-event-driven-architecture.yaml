# Quiz Jour 2 - Event-Driven & Architecture
# Formation HRConnectPro - 20 questions

title: "Quiz Jour 2 - Event-Driven & Architecture"
description: "Évaluez vos connaissances sur Kafka avancé, le multi-module Maven et le soclage technique"

questions:
  # Section 1 : Kafka Avancé (7 questions)

  - text: "L'eventual consistency signifie :"
    type: QCM
    timeLimit: 30
    points: 1000
    answers:
      - "Les données sont toujours cohérentes immédiatement"
      - "Les données deviennent cohérentes après un certain délai"
      - "Les données ne sont jamais cohérentes"
      - "Les données sont stockées dans un cache"
    correctAnswer: 1

  - text: "Dans HRConnectPro, la table `employee_snapshot` dans leave-service contient :"
    type: QCM
    timeLimit: 30
    points: 1000
    answers:
      - "Une copie complète de la table employees"
      - "Une projection des données nécessaires à leave-service"
      - "Les logs des employés"
      - "Les sauvegardes"
    correctAnswer: 1

  - text: "Le pattern Outbox consiste à :"
    type: QCM
    timeLimit: 30
    points: 1000
    answers:
      - "Envoyer des emails"
      - "Stocker les événements à publier dans la même transaction que les données métier"
      - "Utiliser un cache externe"
      - "Créer des backups"
    correctAnswer: 1

  - text: "`TransactionSynchronization` en Spring permet de :"
    type: QCM
    timeLimit: 30
    points: 1000
    answers:
      - "Synchroniser les threads"
      - "Exécuter du code après le COMMIT d'une transaction"
      - "Créer des transactions distribuées"
      - "Verrouiller les tables"
    correctAnswer: 1

  - text: "Dans Kafka, une partition permet de :"
    type: QCM
    timeLimit: 30
    points: 1000
    answers:
      - "Diviser les messages pour la scalabilité"
      - "Créer des backups"
      - "Sécuriser les messages"
      - "Compresser les données"
    correctAnswer: 0

  - text: "L'offset dans Kafka représente la position d'un message dans une partition."
    type: VRAI_FAUX
    timeLimit: 20
    points: 1000
    correctAnswer: true

  - text: "Pour garantir l'idempotence avec Kafka, on stocke :"
    type: QCM
    timeLimit: 30
    points: 1000
    answers:
      - "Le timestamp"
      - "La partition et l'offset"
      - "Le payload complet"
      - "L'adresse IP"
    correctAnswer: 1

  # Section 2 : Multi-Module Maven (7 questions)

  - text: "Un module Maven \"contract\" contient :"
    type: QCM
    timeLimit: 30
    points: 1000
    answers:

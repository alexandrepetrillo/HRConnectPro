  - text: "Le versioning sémantique (semver) suit le format :"
    type: QCM
    timeLimit: 30
    points: 1000
    answers:
      - "MAJOR.MINOR"
      - "YEAR.MONTH.DAY"
      - "MAJOR.MINOR.PATCH"

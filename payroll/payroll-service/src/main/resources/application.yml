spring:
  application:
    name: payroll-service

  datasource:
    url: jdbc:postgresql://localhost:5433/hrconnect?currentSchema=payroll
    username: hrconnect
    password: hrconnect
    driver-class-name: org.postgresql.Driver

  # Configuration pour l'observation JDBC (traces SQL)
  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: payroll
        # Activation des statistiques Hibernate pour le tracing
        generate_statistics: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: payroll
    default-schema: payroll

  kafka:
    bootstrap-servers: localhost:9093
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

server:
  port: 8099

logging:
  level:
    com.hrconnect.payroll: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Kafka Topics
kafka:
  topics:
    payroll-state: payroll.state

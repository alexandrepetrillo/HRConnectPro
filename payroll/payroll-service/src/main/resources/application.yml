server:
  port: 8084

spring:
  application:
    name: payroll-service

  datasource:
    url: jdbc:postgresql://localhost:5432/hrconnectpro
    username: hrconnect
    password: hrconnect123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: payroll
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: payroll

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payroll-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false

# JWT Configuration
jwt:
  secret: hrconnect-jwt-secret-key-2024-very-long-secret-key-for-security
  expiration: 86400000

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Logging
logging:
  level:
    com.hrconnect.payroll: DEBUG
    org.springframework.kafka: INFO
